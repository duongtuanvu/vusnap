name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore VuSnap.sln
      - name: Build
        run: dotnet build VuSnap.sln -c Release --no-restore

      - name: Run core regression tests
        run: dotnet run --project tests/VuSnap.Core.Tests/VuSnap.Core.Tests.csproj -c Release
