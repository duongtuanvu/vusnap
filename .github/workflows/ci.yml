name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore VuSnap.sln
      - name: Build
        run: dotnet build VuSnap.sln -c Release --no-restore
      - name: Run core regression tests
        run: dotnet run --project tests/VuSnap.Core.Tests/VuSnap.Core.Tests.csproj -c Release

  # Keep the existing installer verification gate on PRs, but never store CI artifacts.
  packaging:
    if: github.event_name != 'push'
    uses: ./.github/workflows/package.yml
    with:
      upload: false
      installer: true
