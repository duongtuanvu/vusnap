name: Package (reusable)
on:
  workflow_call:
    inputs:
      upload:
        type: boolean
        required: true
      installer:
        type: boolean
        required: true
permissions:
  contents: read
jobs:
  packaging:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish portable
        run: dotnet publish src/VuSnap/VuSnap.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/self-contained
      - name: Verify published files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (Resolve-Path out/self-contained).Path
          if (!(Test-Path "$source/VuSnap.exe") -or !(Test-Path "$source/LICENSE")) { throw 'ERR_PACKAGE_MISSING_FILE' }
          if ((Get-FileHash "$source/LICENSE").Hash -ne (Get-FileHash LICENSE).Hash) { throw 'ERR_PACKAGE_LICENSE' }
      - name: Verify assets and build installer
        if: inputs.installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (Resolve-Path out/self-contained).Path
          if (!(Test-Path "$source/VuSnap.exe") -or !(Test-Path "$source/LICENSE")) { throw 'ERR_PACKAGE_MISSING_FILE' }
          if ((Get-FileHash "$source/LICENSE").Hash -ne (Get-FileHash LICENSE).Hash) { throw 'ERR_PACKAGE_LICENSE' }
          $icon = [IO.File]::ReadAllBytes((Resolve-Path src/VuSnap/Assets/app-fit.ico).Path)
          if ([BitConverter]::ToUInt16($icon,2) -ne 1 -or [BitConverter]::ToUInt16($icon,4) -ne 7) { throw 'ERR_PACKAGE_ICON' }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'ERR_PACKAGE_INNO_INSTALL' }
          }
          $dist = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force $dist | Out-Null
          $version = ([xml](Get-Content src/VuSnap/VuSnap.csproj -Raw)).Project.PropertyGroup.Version
          & $iscc "/DAppVersion=$version" "/DSourceDir=$source" "/DOutputDir=$dist" installer/VuSnap.iss
          if ($LASTEXITCODE -ne 0) { throw 'ERR_PACKAGE_INSTALLER' }
          if (!(Test-Path "$dist/VuSnap-$version-setup.exe")) { throw 'ERR_PACKAGE_INSTALLER_MISSING' }
      - name: Stage portable package
        if: inputs.upload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path out/self-contained/VuSnap.exe,out/self-contained/LICENSE -DestinationPath dist/VuSnap-portable.zip
      - uses: actions/upload-artifact@v4
        if: inputs.upload
        with:
          name: VuSnap-preview-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
